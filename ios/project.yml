# Fonte canônica do projeto Xcode (XcodeGen). Gere com ./bootstrap.sh
name: FotocelulaTambor
options:
  bundleIdPrefix: br.com.tportooliveira
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: pt-BR
  xcodeVersion: "15.0"
  createIntermediateGroups: true
packages:
  PhotocellCore:
    path: Packages/PhotocellCore
targets:
  FotocelulaTambor:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    dependencies:
      - package: PhotocellCore
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.tportooliveira.fotocelulatambor
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
schemes:
  FotocelulaTambor:
    build:
      targets:
        FotocelulaTambor: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PhotocellCore/PhotocellCoreTests
    profile:
      config: Release
    archive:
      config: Release
